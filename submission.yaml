# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: ""                             # REQUIRED — e.g., "Orion Squad"
  track: ""                            # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: ""                           # REQUIRED — e.g., "Alice Chen"
    email: ""                          # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: ""                         # REQUIRED — Team member 1
      email: ""
    - name: ""                         # Add more members by copying the two lines above
      email: ""
    - name: ""
      email: ""

submission:
  title: "MissionGuard AI"             # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military asset maintainers lack fast, explainable insights into which platforms
    are mission-ready, why assets are at risk, and what to service first. Spreadsheets
    of sensor data do not produce ranked, actionable maintenance decisions.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    MissionGuard AI provides an intelligent decision-support system that analyzes
    fleet health using explainable ML, classifies mission readiness, ranks maintenance
    priorities, and exposes insights through REST API, interactive dashboard, and
    conversational AI via IBM Bob / Model Context Protocol integration.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Explainable risk scoring with human-readable risk factors for every asset"
    - "Mission readiness classification (READY/WARNING/NOT_READY) based on multiple evidence sources"
    - "Maintenance priority ranking with deterministic scoring across the entire fleet"
    - "IBM Bob conversational interface via Model Context Protocol (MCP) for natural language queries"
    - "Interactive Streamlit dashboard with fleet overview, priority queue, and per-asset detail views"

  tech_stack:
    languages: ["Python 3.13"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Streamlit", "scikit-learn", "pandas"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["Model Context Protocol (MCP) for IBM Bob / watsonx integration"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["CSV (local synthetic dataset)"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["NumPy", "pytest", "uvicorn", "requests"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Clean architectural layering where each agent builds on previous work without
    rewriting it, comprehensive explainability with human-readable risk factors,
    71 automated tests covering all layers, and genuine IBM Bob MCP integration
    ready for conversational AI interaction.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Uses synthetic data only (not real military telemetry), employs logistic
    regression with domain heuristics rather than deep learning, generates labels
    rather than using observed failure rates, requires IBM Bob installation
    separately for live conversational interface testing.

